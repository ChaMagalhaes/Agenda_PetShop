<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

    <th:block th:replace="~{fragments/head :: head('Listagem de Pet')}"></th:block>
    <body>
        <th:block th:replace="~{fragments/head :: header}"></th:block>
        <div class="container">
            <h1>Listagem de Pet</h1>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Raca</th>
                    <th scope="col">Deletar</th>
                    <th scope="col">Editar</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pet : ${petsList}">
                    <td scope="row" th:text="${pet.name}"></td>
                    <td scope="row" th:text="${pet.raca}"></td>
                    <td>
                        <a th:href="@{/pet/delete/{id}(id=${pet.id})}">Deletar</a>
                    </td>
                    <td>
                        <a th:href="@{/pet/edit/{id}(id=${pet.id})}">Editar</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="row">
                <a th:href="@{/pet/create}">
                    <button class="btn btn-primary">Cadastrar Pet</button>
                </a>
            </div>
        </div>
        <th:block th:replace="~{fragments/footer :: footer}"></th:block>
    </body>
</html>
