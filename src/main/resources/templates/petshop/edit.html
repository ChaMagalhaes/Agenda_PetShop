<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{fragments/head :: head('Editar Pet')}"></th:block>
    <body>
        <th:block th:replace="~{fragments/head :: header}"></th:block>
        <div class="container">
            <h1>Editar Pet</h1>
            <form action="#" th:action="@{/pet/save}" th:object="${pet}" method="POST">

                <!-- Campo necessário para que o save saiba que não estamos criando, mas editando um produto -->
                <input type="hidden" th:field="*{id}" />

                <div class="form-group row">
                    <label for="name" class="col-sm-2 col-form-label">Nome</label>
                    <div class="col-sm-10">
                        <input type="text" th:field="*{name}" class="form-control" id="name" name="name" placeholder="Digite o nome do produto">
                        <p th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></p>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label" for="raca">Raça:</label>
                    <div class="col-sm-10">
                        <textarea id="raca" th:field="*{raca}" class="form-control" name="raca" rows="4" cols="50"></textarea>
                        <p th:if="${#fields.hasErrors('raca')}" class="text-danger" th:errors="*{raca}"></p>
                    </div>
                </div>

                <button type="submit" class="btn btn-info col-2"> Atualizar Pet</button>
            </form>
        </div>
        <th:block th:replace="~{fragments/footer :: footer}"></th:block>
    </body>
</html>
