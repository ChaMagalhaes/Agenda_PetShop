<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Pet</title>

    <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
            integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
            crossorigin="anonymous"
    />
</head>
<body>
<div class="container pt-5">
    <h1>Cadastrar Pet</h1>
    <form action="#" th:action="@{/pet/save}" th:object="${pet}" method="POST">
        <div class="form-group row">
            <label for="name" class="col-sm-2 col-form-label">Nome</label>
            <div class="col-sm-10">
                <input type="text" th:field="*{name}" class="form-control" id="name" name="name" placeholder="Digite o nome do pet">
                <p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="*{name}" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-2 col-form-label" for="raca">Raça:</label>
            <div class="col-sm-10">
                <textarea id="raca" th:field="*{raca}" class="form-control" name="raca" rows="4" cols="50"></textarea>
                <p th:if="${#fields.hasErrors('raca')}" th:errorclass="text-danger" th:errors="*{raca}" />
            </div>
        </div>

        <button type="submit" class="btn btn-info"> Cadastrar Pet</button>
    </form>
</div>
</body>
</html>
